name: Deploy demo to GitHub Pages

# 백엔드 없이 도는 데모를 배포한다. 응답은 demo-data/에서 정적 파일로 펼쳐지고
# (frontend/scripts/build-demo-api.mjs), 앱은 그것을 API로 읽는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포 중에 새 푸시가 들어오면 앞의 것은 취소한다. 마지막 상태만 의미가 있다.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 프로젝트 페이지는 /<repo>/ 아래에 서빙된다. basePath가 붙어야 자원 경로가
      # 맞고, fetch 경로에는 자동으로 안 붙으므로 NEXT_PUBLIC_BASE_PATH로 따로 준다.
      - name: Build static export
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_DEMO: "1"
        run: npm run build

      # Jekyll이 _로 시작하는 Next 자원 디렉터리를 걸러내지 않도록 한다.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
